- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: Ensure fail2ban is running and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes

- name: Deploy jail.local configuration
  copy:
    src: /opt/test/jail.local
    dest: /etc/fail2ban/jail.local
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban